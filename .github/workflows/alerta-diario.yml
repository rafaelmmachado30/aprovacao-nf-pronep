name: SOL — Alertas diários e resumo semanal

# ⚠ PROPOSTA DE CONSERTO — nao aplicada. Ver LEIA-ME.md ao lado.
#
# Dispara o endpoint /api/AlertaDiario nos horarios certos.
# GitHub Actions cron usa UTC. BRT = UTC-3.
#
#   9h BRT = 12h UTC (manha, seg-sex)
#  17h BRT = 20h UTC (tarde seg-qui / semanal sex)

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 9h BRT — manha
    - cron: '0 20 * * 1-4'   # 17h BRT seg-qui — tarde
    - cron: '0 20 * * 5'     # 17h BRT sexta — semanal
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de alerta (manha | tarde | semanal)'
        required: true
        default: 'manha'
        type: choice
        options: [manha, tarde, semanal]

jobs:
  disparar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Detectar o tipo pelo cron que disparou
        id: detect
        env:
          MANUAL: ${{ github.event.inputs.tipo }}
          # ⚠ AQUI ESTAVA O DEFEITO. A versao anterior deduzia o tipo pela HORA
          # UTC do relogio ("if UTC_HOUR = 12 entao manha"). O cron do GitHub
          # ATRASA — medido nas execucoes reais: 16h13, 17h36, 22h25, 02h46 —,
          # e nenhuma dessas casa com 12 nem com 20. Todas caiam no `else`, que
          # assumia "manha". Resultado: nas 26 execucoes conferidas em
          # 14/09/2026, TODAS se declararam manha, inclusive as das 22h. O
          # alerta da tarde e o resumo de sexta nunca sairam como tal.
          #
          # `github.event.schedule` traz a EXPRESSAO que disparou, exatamente
          # como escrita acima. Nao depende de relogio e nao sofre atraso.
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            TIPO="$MANUAL"
          else
            case "${CRON:-}" in
              '0 12 * * 1-5') TIPO=manha   ;;
              '0 20 * * 1-4') TIPO=tarde   ;;
              '0 20 * * 5')   TIPO=semanal ;;
              *)
                echo "::error::cron nao reconhecido: '${CRON:-vazio}'. As expressoes"
                echo "::error::do bloco 'on.schedule' mudaram e este passo nao foi ajustado."
                exit 1
                ;;
            esac
          fi
          echo "tipo=$TIPO" >> "$GITHUB_OUTPUT"
          echo "Tipo: $TIPO   (cron='${CRON:-manual}')"

      - name: Chamar /api/AlertaDiario
        env:
          TIPO: ${{ steps.detect.outputs.tipo }}
          SECRET: ${{ secrets.ALERTA_DIARIO_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${SECRET:-}" ] || { echo "::error::ALERTA_DIARIO_SECRET nao configurado"; exit 1; }
          URL="https://purple-forest-09588fe10.7.azurestaticapps.net/api/AlertaDiario?tipo=$TIPO"
          echo "Disparando $URL"
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "X-Alerta-Secret: $SECRET" -H "Accept: application/json" \
            --max-time 290 "$URL")
          echo "HTTP $HTTP_CODE"
          head -c 2000 /tmp/response.json; echo ""
          [ "$HTTP_CODE" = "200" ] || { echo "::error::AlertaDiario retornou HTTP $HTTP_CODE"; exit 1; }

      - name: Chamar /api/AlertaRecorrentes (só na manhã)
        if: steps.detect.outputs.tipo == 'manha'
        env:
          SECRET: ${{ secrets.ALERTA_DIARIO_SECRET }}
        run: |
          set -euo pipefail
          URL="https://purple-forest-09588fe10.7.azurestaticapps.net/api/AlertaRecorrentes"
          echo "Disparando $URL"
          HTTP_CODE=$(curl -s -o /tmp/resp_rec.json -w "%{http_code}" \
            -H "X-Alerta-Secret: $SECRET" -H "Accept: application/json" \
            --max-time 290 "$URL")
          echo "HTTP $HTTP_CODE"
          head -c 2000 /tmp/resp_rec.json; echo ""
          # ⚠ CONTINUA SEM DERRUBAR O JOB, e isso e' deliberado: o alerta
          # principal ja' saiu, e falhar aqui apagaria esse fato. MAS o aviso
          # passou 19 dias sem ninguem ler — e' por isso que existe o agente
          # vigia-actions, que acusa justamente o job VERDE com aviso dentro.
          # Se voces preferirem que falhe, troque o echo abaixo por um exit 1.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::AlertaRecorrentes retornou HTTP $HTTP_CODE"
          fi

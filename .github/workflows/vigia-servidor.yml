name: Vigia do Servidor (os agentes deram sinal?)

# ESTE WORKFLOW FICA NO GITHUB DE PROPOSITO, e e' o unico que deve ficar.
#
# Desde 15/09/2026 as automacoes estao saindo daqui e virando agentes no
# servidor PRONEP-ANALYTICS. A troca e' boa, mas cria um risco que nao existia:
# o GitHub e' altamente disponivel; o servidor nao. Se ele desligar, ou o
# Agendador de Tarefas parar, os agentes param EM SILENCIO — e a tela que
# mostraria isso roda no mesmo servidor que caiu.
#
# Entao o GitHub deixa de MANDAR trabalho e passa a CONFERIR que o trabalho
# aconteceu. E' o inverso de tudo o que ele fazia aqui, e e' o papel que ele
# desempenha bem: estar de pe quando o resto nao esta'.
#
# POR QUE OS HORARIOS SAO ESTES, e a conta importa:
#   os agentes rodam em horario comercial, dia util. Conferir de madrugada
#   acusaria "mudo" toda noite, e alerta que toca toda noite deixa de ser lido —
#   que e' o mesmo defeito do `::warning::` verde que nos trouxe ate' aqui.
#
#   As 11h de Brasilia todo agente ja' rodou pelo menos uma vez no dia (o de
#   alerta as 09h, a varredura as 06h30, o snapshot as 07h). As 09h nao servia:
#   o alerta roda as 09h EM PONTO e daria empate com a conferencia.
#
#   ⚠ E A CONFERENCIA DA MANHA NAO RODA NA SEGUNDA. Na segunda as 11h, o ultimo
#   alerta foi na sexta as 17h — 66h de silencio LEGITIMO. Para nao acusar isso,
#   a tolerancia teria de passar de 66h em todo agente de dia util, e ai' uma
#   parada real de dois dias no meio da semana nao acenderia luz nenhuma.
#   Melhor conferir uma vez a menos e poder cobrar 10h do que conferir sempre e
#   so' poder cobrar 70h. Na segunda a conferencia das 16h pega tudo.
#
# Pre-requisito: o secret AUTOMACAO_EMAILS_SECRET (o mesmo que a varredura ja'
# usava). Nenhuma credencial nova — vigia que exige credencial nova e' vigia que
# alguem deixa de instalar.

on:
  schedule:
    - cron: '0 14 * * 2-5'   # 11h BRT, ter-sex (na segunda o fim de semana atrapalha)
    - cron: '0 19 * * 1-5'   # 16h BRT, seg-sex
  workflow_dispatch:

concurrency:
  group: vigia-servidor
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Perguntar ao batimento quem deu sinal
        env:
          SECRET: ${{ secrets.AUTOMACAO_EMAILS_SECRET }}
        run: |
          set -u
          if [ -z "$SECRET" ]; then
            echo "::error::Secret AUTOMACAO_EMAILS_SECRET nao configurado no repo"; exit 1
          fi
          URL="https://purple-forest-09588fe10.7.azurestaticapps.net/api/BatimentoAgentes"
          HTTP=$(curl -s -o /tmp/bat.json -w "%{http_code}" \
            -H "X-Automacao-Secret: $SECRET" -H "Accept: application/json" \
            --max-time 120 "$URL")
          echo "HTTP $HTTP"
          cat /tmp/bat.json | head -c 4000; echo ""

          # ⚠ Endpoint fora do ar NAO e' prova de que os agentes estao vivos, e
          # tambem nao e' prova de que morreram. Falha o job dizendo QUAL das
          # duas coisas nao se sabe — silencio ambiguo e' o que este vigia existe
          # para eliminar.
          if [ "$HTTP" != "200" ]; then
            echo "::error::Nao consegui LER o batimento (HTTP $HTTP). Nao sei se os agentes rodaram."
            exit 1
          fi

          MUDOS=$(python3 -c "import json;print(','.join(json.load(open('/tmp/bat.json'))['mudos']))")
          NUNCA=$(python3 -c "import json;print(','.join(json.load(open('/tmp/bat.json')).get('nunca_reportou') or []))")

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/bat.json'))
          print(f"{'agente':<24} {'idade':>8}  {'prazo':>8}  situacao")
          print('-' * 62)
          for a in d['agentes']:
              marca = 'MUDO' if a['mudo'] else 'ok'
              print(f"{a['agente']:<24} {a['idade_horas']:>7.1f}h {a['tolerancia_horas']:>7}h  {marca}"
                    + (f"  ({a['status']})" if a.get('status') else ''))
          PY

          # ⚠ Quem sabe quantos agentes existem e' o CATALOGO DE TAREFAS do
          # servidor, que viaja no proprio batimento. Aqui nao ha' numero cravado
          # de proposito: um numero neste arquivo apodreceria na primeira tarefa
          # nova, e quem a criasse nao teria motivo nenhum para vir mexer aqui.
          FALHOU=0
          if [ -n "$MUDOS" ]; then
            echo "::error::Agente(s) que pararam de dar sinal: $MUDOS"
            FALHOU=1
          fi
          if [ -n "$NUNCA" ]; then
            echo "::error::Agente(s) que NUNCA deram sinal: $NUNCA"
            FALHOU=1
          fi
          if [ "$FALHOU" -eq 1 ]; then
            echo "Onde olhar: o console da Central, em http://10.2.10.77:8770 (pela VPN),"
            echo "e o Agendador de Tarefas do PRONEP-ANALYTICS, pasta \\Pronep."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/bat.json'));print(f\"Todos os {d['quantos']} agentes deram sinal dentro do prazo.\")"
